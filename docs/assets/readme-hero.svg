<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title description">
  <title id="title">AEGIS - Visual automation for Windows</title>
  <desc id="description">A dark blue banner with connected workflow cards and the AEGIS wordmark.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1422"/><stop offset="1" stop-color="#17243a"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#41d9ae"/><stop offset="1" stop-color="#65a8ff"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="1" fill="#a2c1e8" opacity=".12"/></pattern>
  </defs>
  <rect width="1280" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="20" fill="url(#dots)"/>
  <path d="M704 75H744M704 225H744M1225 75H1250M1225 225H1250" stroke="#324660" stroke-width="1"/>
  <g font-family="Segoe UI,Arial,sans-serif">
