name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_release.py
      - run: python scripts/export_github.py --output release/source.zip
  windows-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit, integration, security and Windows runtime checks
        run: python scripts/run_tests.py --report release/test-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-test-evidence-python-${{ matrix.python }}
          path: release/test-report.json
